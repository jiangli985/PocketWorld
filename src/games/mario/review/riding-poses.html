<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑乘姿态检查</title>
<style>body{margin:24px;background:#ecf5f8;color:#294b5c;font:16px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;max-width:1100px}figure{margin:0;background:#fff9ec;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;height:auto}figcaption{padding:8px;text-align:center}</style>
<h1>骑乘姿态检查</h1><p id="status">载入同款游戏素材…</p><main></main>
<script type="module">
import {createRun} from '../engine.ts';
import {loadAssets} from '../assets.ts';
import {renderGame} from '../renderer.ts';
const assets=await loadAssets();
for(const kind of ['slide','charge']) for(const degrees of [0,90,180,270]) {
 const state=createRun('valley');
 state.features=[]; state.chasers=[]; state.time=.42;
 Object.assign(state.player,{partner:kind,grounded:false,flipping:true,angle:degrees*Math.PI/180,y:285});
 const scene=document.createElement('canvas'); scene.width=800;scene.height=600;
 renderGame(scene.getContext('2d'),state,assets,{phase:'playing',reducedMotion:true});
 const figure=document.createElement('figure'), canvas=document.createElement('canvas');
 canvas.width=220;canvas.height=260;
 canvas.getContext('2d').drawImage(scene,130,155,220,260,0,0,220,260);
 const caption=document.createElement('figcaption');caption.textContent=(kind==='slide'?'贴地滑行':'冲撞护航')+' · '+degrees+'°';
 figure.append(canvas,caption);document.querySelector('main').append(figure);
}
document.querySelector('#status').textContent=assets.errors.length?'部分素材未加载':'使用游戏实际素材与绘制逻辑，展示同一骑乘组合的四个翻滚角度。';
</script></html>
